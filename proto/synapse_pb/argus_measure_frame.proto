syntax = "proto3";

package synapse_pb;

message ArgusMeasureFrame {
  enum State {
    ARGUS_STATE_NONE                  = 0x0000;
    ARGUS_STATE_XTALK_MONITOR_ACTIVE  = 0x0001;
    ARGUS_STATE_DUAL_FREQ_MODE        = 0x0002;
    ARGUS_STATE_MEASUREMENT_FREQ      = 0x0004;
    ARGUS_STATE_DEBUG_MODE            = 0x0008;
    ARGUS_STATE_WEAK_SIGNAL           = 0x0010;
    ARGUS_STATE_BGL_WARNING           = 0x0020;
    ARGUS_STATE_BGL_ERROR             = 0x0040;
    ARGUS_STATE_PLL_LOCKED            = 0x0080;
    ARGUS_STATE_LASER_WARNING         = 0x0100;
    ARGUS_STATE_LASER_ERROR           = 0x0200;
    ARGUS_STATE_HAS_DATA              = 0x0400;
    ARGUS_STATE_HAS_AUX_DATA          = 0x0800;
    ARGUS_STATE_SATURATED_PIXELS      = 0x1000;
    ARGUS_STATE_DCA_POWER_HIGH        = 0x2000;
    ARGUS_STATE_DCA_GAIN_MED_LOW      = 0x4000;
    ARGUS_STATE_DCA_GAIN_MED_HIGH     = 0x8000;
    ARGUS_STATE_DCA_GAIN_HIGH         = 0xC000;
    ARGUS_STATE_DCA_MIN               = 0x10000;
    ARGUS_STATE_DCA_MAX               = 0x20000;
    ARGUS_STATE_DCA_RESET             = 0x40000;
  }

  uint32 integration_time = 1;           // The integration time determines the measured time between the start signal and the IR
  uint32 px_en_mask = 2;                 // Pixel enabled mask for the 32 pixels sorted by x-y-indices.
  uint32 ch_en_mask = 3;                 // ADS channel enabled mask for the remaining channels 31 .. 63 (miscellaneous values)
  uint32 state = 4;                      // The current state of the measurement frame
  float analog_integration_depth = 5;    // Pattern count per sample in uq10.6, determines the analog integration depth.
  uint32 digital_integration_depth = 6;  // Sample count per phase/frame, determines the digital integration depth.
  float output_power = 7;                // Laser Modulation Current per sample in uq12.4 mA, determines the optical output power.
  uint32 bias_current = 8;               // Laser Bias Current Settings in LSB.
  uint32 pixel_gain = 9;                 // Charge pump voltage per sample in LSB, determines the pixel gain.
  int32 pll_offset = 10;                 // PLL Frequency Offset, caused by temperature compensation, in PLL_INT_PRD LSBs.
  uint32 pll_ctrl_cur = 11;              // The current PLL_CTRL_CUR value.
}
